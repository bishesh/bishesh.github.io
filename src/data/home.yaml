intro: |
  I am the founding Chairperson of [NAAMII](https://naamii.org.np), Nepal's AI centre of excellence,
  which I helped build from an idea into an institute of 52 full-time staff. I am also co-founder and
  Chief Scientific Officer of **Tangible**. I trained at INRIA, King's College London and Imperial
  College London. My research has moved from medical imaging, to AI for health in low-resource
  settings, and now to how learning, skills and work are being reorganized by AI.
