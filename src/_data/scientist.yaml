eras:
  - when: "2012–2016"
    where: INRIA, France
    title: Modelling the brain
    text: |
      One of the first biophysical models of longitudinal brain deformation from atrophy in Alzheimer's
      disease ([NeuroImage 2016](https://doi.org/10.1016/j.neuroimage.2016.04.010)), and a simulator of
      realistic longitudinal MRIs with known volume changes. PhD with Nicholas Ayache and Xavier Pennec.
  - when: "2017–2019"
    where: King's College London · Imperial College London
    title: Machine learning for fetal ultrasound
    text: |
      On the iFIND project: standard-plane detection in 3D fetal ultrasound, tracking in freehand 4D
      ultrasound without external trackers, ultrasound–MRI registration and multi-view compounding.
      Worked with Julia Schnabel, Bernhard Kainz and Daniel Rueckert.
  - when: "2019–"
    where: NAAMII, Nepal
    title: Health AI for low-resource settings
    text: |
      **AI-powered task-shifting**: letting nurses and frontline workers do what used to need a specialist.
      Blind-sweep obstetric ultrasound that non-experts can perform, smartphone microscopy for parasites,
      AI-assisted cervical screening, and 3D bone shape from two inexpensive X-rays
      ([NeurIPS 2023](/publications/?themes=xray-3d)). Many of these are among the first papers from
      Nepal in their fields.
  - when: "2022–"
    where: NAAMII
    title: Foundation models, efficiently
    text: |
      Making large vision-language models useful on small, noisy medical datasets and modest hardware:
      prompt tuning, lightweight adapters, and robustness to label noise.
  - when: "2021–"
    where: International consortia
    title: Trustworthy AI & policy
    text: |
      Co-author of the [FUTURE-AI](https://doi.org/10.1136/bmj-2024-081554) international consensus guideline
      (BMJ 2025) and of a framework for just and equitable health AI in South Asia (npj Digital Medicine
      2025). Member of the committee that drafted Nepal's national AI policy.
  - when: "Now"
    where: NAAMII · Tangible
    title: Reorganizing work
    now: true
    text: |
      Every organization is a set of processes: flows that turn data into changes in its records, through
      actors who may be people or AI agents. My current research follows one chain from start to end.
      Personalized learning on problems that are real in the organization changes how its processes run,
      and those reorganized processes then have to be built. In health, I call this
      **implementation science for AI and health**. The first paper is
      [*The AI Pyramid*](/publications/?themes=reorganizing-work).
    chain:
      - Personalized, scalable learning
      - Skilling on real problems
      - Capability building
      - Reorganized processes
      - Built and deployed
projects:
  - { name: AI for ultrasound, text: "Making portable, low-cost ultrasound usable by non-experts: acquisition, quality control, gestational age and biometrics from blind sweeps." }
  - { name: Setting change, text: "Can we know, before retraining, how a model will perform in a new hospital or country, and adapt it on the smallest budget?" }
  - { name: Workforce & health AI, text: "Agentic health-AI systems, and the training and workflow changes they need to actually work in a clinic." }
  - { name: Frugal diagnostics, text: "Smartphone microscopy, paper-based assays and AI-assisted cervical screening, built for places without a lab." }
  - { name: Foundation models at the edge, text: "Compressing multimodal foundation models so they are more accurate with fewer parameters, on devices that fit the setting." }
  - { name: CDiTH, IIIT Hyderabad, text: "As consultant advisor: endometriosis, surgical-video understanding, and evaluation of hospital AI." }
