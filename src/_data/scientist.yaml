eyebrow: Scientist · Research
headline: From medical images to how work gets done
lead: |
  I started by modelling how the brain changes in Alzheimer's disease, moved to machine learning for
  fetal ultrasound, and then built a research program in Nepal on AI for health where specialists are
  scarce. My focus now is broader: how work itself is reorganized when any step can be held by a
  person or by an AI agent, and how people are skilled for that change.
