# Builds the Astro site and publishes it to GitHub Pages.
# Runs only on master — the `redesign` branch never deploys.
# Go-live: Settings → Pages → Source: "GitHub Actions", then merge redesign → master.
# The build validates every entry in src/data/*.yaml (src/content.config.ts); a bad edit fails here, not on the live site.
name: Deploy site
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
