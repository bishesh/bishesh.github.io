# On every push to any branch (incl. edits made in the GitHub web editor): build + validate, deploy nothing.
name: Check site
on: { push: { branches-ignore: [master] }, pull_request: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
